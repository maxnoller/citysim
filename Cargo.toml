[workspace]
resolver = "3"
members = ["crates/sim", "crates/game"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
citysim_sim = { path = "crates/sim" }
serde = { version = "1", features = ["derive"] }
slotmap = { version = "1.1", features = ["serde"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
bevy = { version = "0.20.1", default-features = false, features = ["3d", "ui"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# `dev` is the profile for working on the game: `cargo test`, `cargo run`, demo
# cities and screenshots. The game crate compiles quickly (opt-level 1,
# incremental); Bevy and the simulation run at full speed. Line tables only:
# backtraces keep file and line, and the build is smaller and links faster.
# `release` is for playing and for performance measurements.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# The simulation is the hot code in tests, demo cities and scenario runs.
# Same results at any opt-level (no fast-math, floats through `libm`), with
# debug assertions and overflow checks still on.
[profile.dev.package.citysim_sim]
opt-level = 3
