[workspace]
resolver = "3"
members = ["crates/sim", "crates/game"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
citysim_sim = { path = "crates/sim" }
serde = { version = "1", features = ["derive"] }
slotmap = { version = "1.1", features = ["serde"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
bevy = { version = "0.20.1", default-features = false, features = ["3d", "ui"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
