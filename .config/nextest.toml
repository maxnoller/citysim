# cargo-nextest settings (https://nexte.st). Two tiers for the simulation:
#   cargo nextest run -p citysim_sim                 # full: every test, in parallel (before pushing)
#   cargo nextest run -p citysim_sim -P quick        # quick: without the tests that grow cities
#                                                   # for 10 s or more (after each edit)
# `cargo test` still runs everything, as CI does.

[profile.default]
# Report a test as slow after a minute, but never kill it.
slow-timeout = { period = "60s" }

[profile.quick]
# The tests that take 10 s or more on this machine's debug build (grown cities,
# long fuzz runs). Add a new slow test here. The pinned checksum stays in.
default-filter = """
not (
    test(=a_large_zoned_block_fills_with_lots_that_all_front_a_road)
  | test(=a_sensible_layout_built_all_at_once_stays_solvent)
  | test(=an_avenue_carries_more_than_twice_a_street_through_a_junction)
  | test(=bad_layout_jams_and_a_second_connection_fixes_it)
  | test(=building_a_district_up_front_is_viable)
  | test(=bulldoze_preview_and_apply_scale_on_a_dense_map)
  | test(=bulldozing_under_traffic_never_panics)
  | test(=busy_city_save_load_lockstep)
  | test(=commuters_leave_early_enough)
  | test(=debt_cuts_services_then_residents_leave_and_it_recovers)
  | test(=disconnected_islands)
  | test(=economy_books_taxes_and_upkeep_daily)
  | test(=enormous_dead_end_tree)
  | test(=fuzz_commands_and_steps_keep_the_world_consistent)
  | test(=fuzz_is_deterministic_and_save_load_keeps_lockstep)
  | test(=growth_is_gradual)
  | test(=happiness_responds_to_taxes)
  | test(=highway_stub_with_everything_bulldozed_around_it)
  | test(=junction_boxes_never_hold_conflicting_cars_and_lanes_never_overlap)
  | test(=map_spanning_diagonal_mesh)
  | test(=money_stays_a_constraint_for_a_player_who_keeps_expanding)
  | test(=overbuilding_goes_broke_but_a_sensible_layout_stays_solvent)
  | test(=people_stay_with_their_car_and_nights_are_quiet)
  | test(=random_edits_keep_graph_valid)
  | test(=ring_road)
  | test(=road_edits_do_not_starve_departures)
  | test(=rush_hours_and_daytime_errands_emerge)
  | test(=same_seed_and_commands_give_identical_worlds)
  | test(=save_load_mid_rush_hour_stays_in_lockstep)
  | test(=turning_traffic_costs_capacity_but_never_blocks_a_junction)
  | test(=zero_tax_is_no_growth_button_and_high_tax_slows_growth)
)
"""
