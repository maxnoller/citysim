version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 20
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 20
    # Compatible updates arrive together in one pull request; each major version gets its own.
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
