name: CI

on:
  push:
  pull_request:

# One run per branch: a new push cancels the old run (private-repo minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Smaller target dir and cache: no debug info in CI builds.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  sim:
    # The sim tests are ~7 minutes of CPU and a runner has two cores: two
    # jobs (nextest partitions) halve the wait for about one more minute of
    # runner time (checkout, toolchain, cache).
    name: Format, clippy and tests (sim ${{ matrix.part }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: sim
          # Both parts build the same; one saves the cache.
          save-if: ${{ matrix.part == 1 }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - if: matrix.part == 1
        run: cargo fmt --all --check
      - if: matrix.part == 1
        run: cargo clippy -p citysim_sim --all-targets -- -D warnings
      # Every test in its own process, all at once. Includes the pinned
      # determinism checksum: a different machine must reproduce the state
      # bit for bit.
      - run: cargo nextest run -p citysim_sim --partition count:${{ matrix.part }}/2

  game:
    name: Check and tests (game)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: System packages for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: game
          # Pushes write the (large) cache; pull requests only read it.
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo check -p citysim --all-targets
      - run: cargo check -p citysim --no-default-features --features gfx
      - run: cargo check -p citysim --no-default-features --features ui
      - run: cargo test -p citysim
