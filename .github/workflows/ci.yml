name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch or pull request: a new push cancels the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Smaller target dir and cache: no debug info in CI builds.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  sim:
    name: Format, clippy and tests (sim)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: sim
      - run: cargo fmt --all --check
      - run: cargo clippy -p citysim_sim --all-targets -- -D warnings
      # Includes the pinned determinism checksum: a different machine must
      # reproduce the state bit for bit.
      - run: cargo test -p citysim_sim

  game:
    name: Check and tests (game)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: System packages for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: game
          # Pushes write the (large) cache; pull requests only read it.
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo check -p citysim --all-targets
      - run: cargo check -p citysim --no-default-features --features gfx
      - run: cargo check -p citysim --no-default-features --features ui
      - run: cargo test -p citysim
